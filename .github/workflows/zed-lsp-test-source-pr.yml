name: Export Zed LSP integration test source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: startsWith(github.head_ref, 'agent/zed-test-source-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone current Zed main
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 https://github.com/zed-industries/zed.git source
          mkdir -p snapshot/crates/project/tests/integration
          cp source/crates/project/tests/integration/lsp_store.rs snapshot/crates/project/tests/integration/
          git -C source rev-parse HEAD > snapshot/upstream-sha.txt

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: zed-lsp-integration-test-source
          path: snapshot
          if-no-files-found: error
          retention-days: 3
