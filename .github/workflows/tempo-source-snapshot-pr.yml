name: Export Tempo frontend queue source snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: startsWith(github.head_ref, 'agent/tempo-source-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone current Tempo main
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 https://github.com/grafana/tempo.git source
          mkdir -p snapshot/modules/frontend/queue snapshot/modules/frontend/v1
          cp source/modules/frontend/queue/queue.go snapshot/modules/frontend/queue/
          cp source/modules/frontend/queue/user_queues.go snapshot/modules/frontend/queue/
          cp source/modules/frontend/queue/queue_test.go snapshot/modules/frontend/queue/
          cp source/modules/frontend/v1/frontend.go snapshot/modules/frontend/v1/
          git -C source rev-parse HEAD > snapshot/upstream-sha.txt

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tempo-frontend-queue-source
          path: snapshot
          if-no-files-found: error
          retention-days: 3
