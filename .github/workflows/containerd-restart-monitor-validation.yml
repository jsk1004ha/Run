          PATCH_B64
          base64 --decode /tmp/containerd.patch.b64 > /tmp/containerd.patch
          cp /tmp/containerd.patch validation-output/candidate.patch

      - name: Clone current containerd main
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth=1 https://github.com/containerd/containerd.git source
          git -C source rev-parse HEAD | tee validation-output/upstream-sha.txt

      - name: Set up Go from upstream go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Apply and format candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cd source
          git apply --check /tmp/containerd.patch
          git apply /tmp/containerd.patch
          gofmt -w plugins/restart/monitor.go plugins/restart/monitor_test.go
          git diff --check
          git diff -- plugins/restart/monitor.go plugins/restart/monitor_test.go > ../validation-output/applied.diff

      - name: Test restart monitor package
        shell: bash
        run: |
          set -euo pipefail
          cd source
          go test ./plugins/restart 2>&1 | tee ../validation-output/go-test-restart.log

      - name: Race-test restart monitor package
        shell: bash
        run: |
          set -euo pipefail
          cd source
          go test -race ./plugins/restart 2>&1 | tee ../validation-output/go-test-race-restart.log

      - name: Test containerd server package
        shell: bash
        run: |
          set -euo pipefail
          cd source
          go test ./cmd/containerd/server 2>&1 | tee ../validation-output/go-test-server.log

      - name: Vet changed and lifecycle packages
        shell: bash
        run: |
          set -euo pipefail
          cd source
          go vet ./plugins/restart ./cmd/containerd/server 2>&1 | tee ../validation-output/go-vet.log

      - name: Record environment and final diff
        if: always()
        shell: bash
        run: |
          set +e
          { go version; go env GOOS GOARCH GOVERSION; } > validation-output/go-environment.txt 2>&1
          if [ -d source/.git ]; then
            git -C source status --short > validation-output/git-status.txt
            git -C source diff --check > validation-output/diff-check.txt 2>&1
            git -C source diff -- plugins/restart/monitor.go plugins/restart/monitor_test.go > validation-output/final.diff
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: containerd-restart-monitor-validation
          path: validation-output
          if-no-files-found: error
          retention-days: 7
